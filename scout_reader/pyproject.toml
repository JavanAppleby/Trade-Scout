[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-reader"
version = "0.2.0"
description = "Stdlib-only reader of Scout's files: true, false or unknown with evidence. Never raises."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["scout_reader"]

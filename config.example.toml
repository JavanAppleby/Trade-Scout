# Scout's settings. Copy this file to config.toml (in Scout's folder) and change what you need.
# Every key is optional: a key you leave out keeps the value shown here. A misspelt key is an
# error, so Scout refuses to start rather than silently ignore it. No setting is ever per ticker.
# Times "HH:MM" are New York (ET) wall times. Plain keys must come before the [tables] below.

# --------------------------------------------------------------------------- paths and identity
radar_dir = ""            # Radar's folder (e.g. 'E:\Radar'); read only. Empty: Radar's finds are skipped.
radar_handoff_subdir = "state/handoff"  # Radar's hand-off file of finds, <trading day>.jsonl, inside radar_dir
pilot_dir = ""            # Pilot's folder; read only. Empty: Pilot's positions are skipped.
levels_dir = "state/levels"   # where Add Levels keeps Jason's files (must be inside Scout's folder)
inbox_dir = "inbox"       # where the owner drops files for Scout (inbox\jason for level files)
watch_symbols = []        # extra symbols to answer for every evening, e.g. ["ABCD"]
contact_email = ""        # sent to the SEC and others in the User-Agent. EMPTY MEANS NO WEB REQUESTS AT ALL.
scout_user_agent = "Scout/{version} ({contact_email})"  # only {version} and {contact_email} may be used

# --------------------------------------------------------------------------- sources and HTTP
source_max_gap_s = 180            # a pause between polls longer than this is a coverage gap
# A good poll that repeats an item Scout had already seen in that feed (or a 304) proves nothing was
# missed since the previous good poll: that time is covered, failed polls included, up to this many
# seconds (owner, 2026-11-04). Beyond it, or when a poll only returned a short page, the rule above
# applies. 1800 = the longest backoff after a 403/429 (source_backoff_max_min); 0 turns this off.
source_overlap_max_gap_s = 1800   # seconds a repeated seen item covers (0 = off)
# Faster polling around the top of each hour, when more releases than one page holds can appear
# within a minute (owner, 2026-11-04). From minute hour_turn_start_min to hour_turn_end_min ET (the
# end minute not included; the window may wrap the hour), inside active_hours_et only.
hour_turn_sources = ["prnewswire"]  # wire sources only
hour_turn_start_min = 58          # :58 ET
hour_turn_end_min = 5             # up to :05 ET, so the last fast poll starts by :04:59
hour_turn_spacing_s = 30.0        # never below the hard minimum for the host (www.prnewswire.com: 30 s)
source_backoff_max_min = 30       # after a 403/429 the wait doubles up to this many minutes
fetch_max_bytes = 2000000         # a larger reply is refused
fetch_timeout_s = 20.0            # seconds before a request is abandoned
http_default_host_spacing_s = 1.0 # minimum seconds between requests to a host not listed below
active_hours_et = ["04:00", "20:00"]  # [start, end): sources use their busy spacing inside, idle spacing outside
refused_after_403s = 3            # a wire that answers this many 403s in a row is not polled again that day
seen_guid_cap = 5000              # item ids remembered per feed for the overlap check
fact_dedupe_days = 7              # ET days of stored facts checked for repeats (a restart re-reads feeds)
ticker_map_retry_s = 600          # a failed read of SEC's ticker list is tried again after this many seconds
# 10-Q and 10-K are read for the gate-5 check only (a small cap that reports
# earnings by 10-Q alone); they are never a gate-6 class and not gate-6 coverage.
edgar_atom_forms = ["8-K", "6-K", "S-1", "S-3", "F-1", "F-3", "424B", "EFFECT", "NT 10-Q", "NT 10-K", "10-Q", "10-K"]  # one EDGAR feed each
ticker_exchange_prefixes = ["NASDAQ", "Nasdaq", "Nasdaq CM", "NasdaqCM", "Nasdaq GM", "NasdaqGM", "Nasdaq GS", "NasdaqGS", "NASDAQ Capital Market", "Nasdaq Global Market", "Nasdaq Global Select Market", "NYSE", "NYSE American", "NYSE MKT", "NYSE Arca", "OTCQB", "OTCQX", "OTC Pink", "OTC", "Cboe BZX"]  # "(NASDAQ: XXX)" tags in titles
wire_title_ticker_suffixes = ["Stock News"]  # a wire title ending "| XXX Stock News" names ticker XXX (Stock Titan); no exchange

# --------------------------------------------------------------------------- the hold answers
hold_catalyst_classes = ["fda", "trial", "contract", "earnings_result"]  # news classes that count as a fresh catalyst (gate 6); contract_or_other left out (owner, 2026-11-04)
earnings_lookback_days = 45       # how far back an "X to report results on <date>" release is searched (gate 5)
earnings_due_start_days = 10      # EDGAR due window starts this many days after a quarter ends
earnings_due_end_days_quarter = 50   # ... and ends this many days after a quarter ends
earnings_due_end_days_annual = 95    # ... or after a fiscal year ends
periodic_max_age_days = 200       # no 10-Q/10-K in this many days: the due window is unknown
nt_recent_days = 45               # an NT 10-Q/NT 10-K this recent makes gate 5 unknown
hold_block_macro_events = false   # true: a macro event before the next open also blocks a hold
fomc_dates = ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]  # FOMC decision days; add 2027 from federalreserve.gov
fomc_decision_time_et = "14:00"   # FOMC statement time
scan_max_price = 20.0             # the brief's overnight catalysts list stocks under this price (where known)
answer_times_et = ["19:30", "19:45"]  # Pilot's answers are written at these times (3 h earlier on early closes)
radar_answers_after_et = "20:00"  # Radar's finds are answered after this time ...
radar_answers_as_of_et = "19:45"  # ... as of this time

# --------------------------------------------------------------------------- macro (record and report only)
nowflation_max_age_h = 30.0               # nowflation data older than this is stale
nowflation_max_stale_weight_pct = 20.0    # stale when more than this % of the market-sourced weight is stale
nowflation_fresh_after_et = "09:15"       # nowflation's daily update is expected by this time
nowflation_read_times_et = ["08:20"]      # nowflation is read at start and at these times
nowflation_release_day_time_et = "08:50"  # an extra read on CPI/PCE release days
macro_agree_minutes = 5                   # nowflation and BLS times within this many minutes agree
inflation_hot_pp = 0.25                   # provisional: set at build from history
inflation_cooling_pp = 0.25               # provisional: set at build from history
inflation_regime_window_days = 20         # the regime compares against this many days
vix_read_after_et = "16:30"               # the Cboe VIX close is read after this time on trading days
bls_data_read_times_et = ["08:40"]        # BLS results (jobs, unemployment, CPI) are read at start and daily at these times
bls_data_release_day_time_et = "09:15"    # a second read on a CPI, NFP or PCE day
jobs_trend_months = 3                     # the jobs trend averages the monthly change over this many months
jobs_strong_k = 150.0                     # provisional: an average at or above this (thousands) is "strong"
jobs_weak_k = 50.0                        # provisional: an average at or below this (thousands) is "weak"

# --------------------------------------------------------------------------- readers and Jason
scout_stale_s = 120               # a heartbeat older than this makes every answer unknown
jason_near_level_pct = 0.01       # "near a Jason level" means within 1%
jason_market_symbols = ["SPY", "QQQ"]  # Jason's market frame symbols
levels_long_horizon_sessions = 10 # the scorer gives a "weeks", "months" or "quarter" horizon at least this many sessions
levels_score_min_scored = 20      # the levels scorecard says INDICATIVE below this many scored levels
levels_tolerance_atr_mult = 0.5   # a level "holds" within this many daily ATRs ...
levels_tolerance_floor_pct = 0.0075   # ... but never less than 0.75% of price
levels_null_draws = 60            # random levels drawn per real level for the comparison
levels_null_window_bars = 126     # bars the random levels are drawn from
levels_null_seed = "scout-levels-v1"  # fixed seed: the comparison is identical on every run

# --------------------------------------------------------------------------- Claude API (off unless you turn it on)
llm_enabled = false               # true needs ANTHROPIC_API_KEY in Scout's .env; labels are evidence only
llm_daily_cost_cap_usd = 1.00     # no call that would cross this in a day (ET)
llm_monthly_cost_cap_usd = 20.0   # ... or in a month
j1_max_calls_per_day = 400        # J1 (headline labels) calls a day at most
j3_max_calls_per_day = 15         # J3 (evening research) calls a day at most
web_search_max_per_day = 30       # web searches a day at most
llm_allowed_domains = ["sec.gov", "prnewswire.com", "businesswire.com", "accesswire.com", "accessnewswire.com", "newsfilecorp.com", "thenewswire.com", "nasdaq.com", "fda.gov", "clinicaltrials.gov"]  # the only sites J3 may search or fetch
llm_item_chars = 2000             # each item sent to Claude is cut to this many characters
web_fetch_max_content_tokens = 8000   # a fetched page is cut to this many tokens
web_search_max_uses = 3           # searches per J3 call at most
j1_batch_size = 20                # headlines per J1 call
j1_interval_s = 120               # J1 runs this often in PRE/CORE/POST
j3_time_et = "19:30"              # J3 runs for open Pilot positions at this time
j3_no_fact_after_s = 600          # J3 also runs for a Radar find with no fact after this many seconds
llm_timeout_s = 120.0             # seconds before a Claude call is abandoned

# --------------------------------------------------------------------------- schedule, verification, loop
brief_time_et = "08:20"           # the morning brief is written at this time on trading days
verify_days = 20                  # trading days of checks before any hold may use Scout
verify_time_et = "20:30"          # the verification report is written at this time on trading days (3 h earlier on early closes)
verify_sample_size = 10           # symbols in the owner's weekly hand-check sample
verify_sample_weekday = "Mon"     # the sample is drawn on this day (Mon..Sun)
heartbeat_interval_s = 30         # the heartbeat is rewritten this often
loop_interval_s = 1.0             # the main loop wakes this often
log_level = "INFO"                # DEBUG, INFO, WARNING or ERROR

# --------------------------------------------------------------------------- Webull (phase 3 only; not in v1)
scout_webull_enabled = false      # must stay false in v1: Scout sends no Webull requests
scout_webull_budget_per_min = 2   # phase 3 only

# --------------------------------------------------------------------------- the inbox and Paper Gains Discord
# Scheduled Claude tasks (Claude Code desktop, Claude in Chrome with the owner's logged-in Discord) write
# capture files into inbox\discord\<channel>\ and level files into inbox\jason\ (docs/INBOX.md). Scout itself
# never logs in or fetches anything from Discord, YouTube or X; it reads those files as untrusted data.
inbox_poll_s = 60                 # the inbox is checked for new capture files this often
discord_enabled = true            # false: capture files are ignored and discord_inbox shows "disabled"
discord_channels = ["daily-watchlist", "weekly-trade-plan", "free-analysis", "brianna-news", "stockmktnewz", "major-headlines", "earnings-whispers", "market-movers", "open-outcrier", "15m-scanner", "daily-scanner", "weekly-scanner"]  # channels accepted (folder name = channel); scanner_alert lines only in the three *-scanner folders
discord_schedule_channels = ["daily-watchlist", "open-outcrier", "market-movers"]  # channels whose earnings lists may feed gate 5 (block only)
discord_prefix_ticker_channels = ["brianna-news"]  # channels whose "TICKER - headline" form names a ticker
discord_headline_channels = ["major-headlines", "stockmktnewz"]  # the brief's market-wide headlines
discord_catalyst_channels = ["brianna-news"]       # the brief's small-cap catalyst headlines
discord_reaction_channels = ["earnings-whispers", "open-outcrier"]  # the brief's earnings reactions (Radar finds, watch symbols)
discord_gate5_enabled = true      # a Discord earnings date in gate 5's window answers "true" (blocks a hold); never "false"
discord_text_max_chars = 2000     # longer post text is cut to this many characters
discord_image_text_max_chars = 4000  # longer image transcriptions are cut to this many characters
discord_max_post_age_days = 14    # posts older than this are refused (repeats are found over this many days)
discord_posted_at_tolerance_s = 120  # posted_at must agree with the message id's own time within this many seconds
discord_schedule_max_ahead_days = 14  # an earnings date further ahead of the post (or before its ET date) is refused
discord_max_file_bytes = 2000000  # a larger capture file is refused whole
discord_expected_every_min = 40   # discord_inbox is "ok" while a capture arrives at least this often in capture hours
discord_cadence_channels = ["brianna-news", "stockmktnewz", "major-headlines", "earnings-whispers", "market-movers", "open-outcrier"]  # the channels whose captures count for discord_inbox (the news task's every-run channels); [] = every channel
discord_capture_hours_et = ["04:00", "20:00"]  # [start, end] on trading days: when captures are expected
discord_brief_max_items = 10      # lines per Discord list in the brief (and scanner groups per timeframe)
discord_scanner_brief_max_tickers = 12  # tickers shown per scanner pattern line in the brief (Radar finds and watch symbols first)

# =========================================================================== tables

# Minimum seconds between two requests to one host (code also enforces hard minimums).
[host_min_spacing_s]
"www.sec.gov" = 0.5
"data.sec.gov" = 0.5
"www.nasdaqtrader.com" = 60.0
"www.stocktitan.net" = 30.0

# Most requests a day to one host.
[host_max_requests_per_day]
"nowflation.com" = 10
"api.bls.gov" = 12      # BLS results: 3 requests a read; BLS allows 25 a day without a key

# Words that give a wire headline its class. First match wins, in the fixed order bankruptcy,
# earnings_date, offering, reverse_split, listing_notice, fda, trial, contract, earnings_result; "other" is
# everything else. earnings_date comes first so a notice that only names a results date ("to
# Announce Financial Results for ... on November 3", "to Report Q3 Results and Phase 2 Data on
# November 12") is never a catalyst and gate 5 reads its date, so its words must be narrow: " ... "
# inside a keyword matches any text, and each earnings_date keyword pairs a scheduling phrase with
# "results" or "earnings" after it ("will host ... results"). Offering words include equity lines,
# ATM sales agreements, warrant inducements and convertible notes, so "agreement" (contract) never
# turns a dilution headline into a catalyst.
# A bare "to release" would also catch "Agreement to Release Its Products" (a contract).
# bankruptcy (owner, 2026-11-04) goes first: a Chapter 11 headline is bad news whatever else it names,
# and it blocks Radar's buy signals (scout_reader.entry_blocks).
# Matching is whole words, any case. Every class must be listed (an empty list is allowed), except
# bankruptcy, which keeps the list shown here when an older table leaves it out.
[class_keywords]
offering = ["public offering", "pricing", "priced", "registered direct", "at-the-market", "at the market", "ATM offering", "ATM program", "ATM facility", "equity distribution agreement", "equity purchase agreement", "standby equity", "equity line", "securities purchase agreement", "warrants", "warrant", "inducement agreement", "convertible note", "convertible notes", "convertible senior notes", "convertible debenture", "convertible debentures", "convertible preferred", "convertible bond", "convertible bonds", "convertible promissory", "debt exchange", "exchange of notes", "settlement of notes", "private placement"]
reverse_split = ["reverse split", "reverse stock split", "share consolidation"]
listing_notice = ["deficiency", "delisting", "Nasdaq notice", "notice of noncompliance", "minimum bid price"]
bankruptcy = ["Chapter 11", "Chapter 7", "Chapter 15", "bankruptcy", "voluntary petition", "voluntary petitions", "restructuring support agreement", "creditor protection"]
fda = ["FDA approval", "FDA approves", "FDA clearance", "510(k) clearance", "PDUFA", "complete response letter", "CRL", "breakthrough therapy designation", "breakthrough device designation", "fast track designation"]
trial = ["topline", "top-line", "Phase 1", "Phase 2", "Phase 3", "Phase 1/2", "Phase 2/3", "Phase 1b", "Phase 1/2a", "Phase 2a", "Phase 2b", "Phase I", "Phase II", "Phase III", "Phase Ib", "Phase IIa", "Phase IIb", "Phase I/II", "Phase II/III", "pivotal trial"]
contract = ["contract", "award", "awarded", "agreement", "partnership", "purchase order", "order"]
earnings_result = ["reports first quarter", "reports second quarter", "reports third quarter", "reports fourth quarter", "reports full year", "reports Q1", "reports Q2", "reports Q3", "reports Q4", "reports fiscal", "financial results for", "reports results"]
earnings_date = ["to report ... results", "to report ... earnings", "to announce ... results", "to announce ... earnings", "to release ... results", "to release ... earnings", "will report ... results", "will report ... earnings", "will announce ... results", "will announce ... earnings", "will release ... results", "will release ... earnings", "to host ... results", "to host ... earnings", "will host ... results", "will host ... earnings", "to hold ... results", "to hold ... earnings", "will hold ... results", "will hold ... earnings", "to webcast ... results", "to webcast ... earnings", "will webcast ... results", "will webcast ... earnings", "schedules ... results", "schedules ... earnings", "timing of ... results", "timing of ... earnings", "date for ... results", "date for ... earnings", "date of ... results", "date of ... earnings", "announces conference call ... results", "announces conference call ... earnings", "announces ... results conference call", "announces ... earnings conference call", "sets ... earnings call for", "sets ... conference call for", "notice of ... earnings call", "notice of ... conference call", "conference call date", "results release date", "results to be released", "results to be reported", "results to be announced", "earnings to be released", "earnings release date"]

# One table per source. Keys: enabled; kind (wire, filing, reference, halt, macro, vix); url;
# paths (extra paths on the same host); min_spacing_s (seconds between polls 04:00-20:00 ET);
# idle_spacing_s (outside those hours; 0 = the same); allowed_hosts (the only hosts it may reach);
# terms_note; max_items (the feed's size, for the overlap check; 0 = unknown); gate6 (its coverage
# must be clean for a "false" fresh-catalyst answer); terms_ok (false keeps titles, links and times only).
[sources.edgar_atom]
enabled = true
kind = "filing"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type={form}&company=&dateb=&owner=include&start=0&count=100&output=atom"
paths = []
min_spacing_s = 60.0
idle_spacing_s = 600.0
allowed_hosts = ["www.sec.gov"]
terms_note = "SEC fair access: declared User-Agent, at most 10 requests a second."
max_items = 100
gate6 = true
terms_ok = true

[sources.edgar_submissions]
enabled = true
kind = "reference"
url = "https://data.sec.gov/submissions/CIK{cik:010d}.json"
paths = []
min_spacing_s = 0.0
idle_spacing_s = 0.0
allowed_hosts = ["data.sec.gov"]
terms_note = "SEC fair access; read on demand, cached per CIK per ET day."
max_items = 0
gate6 = false
terms_ok = true

[sources.edgar_tickers]
enabled = true
kind = "reference"
url = "https://www.sec.gov/files/company_tickers_exchange.json"
paths = []
min_spacing_s = 86400.0
idle_spacing_s = 86400.0
allowed_hosts = ["www.sec.gov"]
terms_note = "SEC fair access; once a day."
max_items = 0
gate6 = false
terms_ok = true

[sources.prnewswire]
enabled = true
kind = "wire"
url = "https://www.prnewswire.com/rss/news-releases-list.rss"
paths = []
min_spacing_s = 60.0
idle_spacing_s = 60.0
allowed_hosts = ["www.prnewswire.com"]
terms_note = "Titles, links and times only until the owner reads the terms (terms_ok = false)."
max_items = 20
gate6 = true
terms_ok = false

# Owner, 2026-11-04. Reposts small-cap releases from GlobeNewswire, Business Wire and the other wires;
# its terms name its RSS feeds as an allowed way to collect data. Keeps only the newest 100 items.
[sources.stocktitan]
enabled = true
kind = "wire"
url = "https://www.stocktitan.net/rss"
paths = []
min_spacing_s = 60.0
idle_spacing_s = 600.0
allowed_hosts = ["www.stocktitan.net"]
terms_note = "Its terms name its RSS feeds as an allowed way to collect data; personal use; at most 30 requests in 5 minutes."
max_items = 100
gate6 = true
terms_ok = false

[sources.nasdaq_halts]
enabled = true
kind = "halt"
url = "https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts"
paths = []
min_spacing_s = 60.0
idle_spacing_s = 0.0
allowed_hosts = ["www.nasdaqtrader.com"]
terms_note = "At most one read a minute; not polled 20:00-04:00 ET except the one dated read."
max_items = 0
gate6 = false
terms_ok = true

[sources.nowflation]
enabled = true
kind = "macro"
url = "https://nowflation.com"
paths = ["/data/release_calendar.json", "/data/realtime.json", "/forecasts/index.json", "/nowflation.ics"]
min_spacing_s = 0.0
idle_spacing_s = 0.0
allowed_hosts = ["nowflation.com"]
terms_note = "Credit Nowflation with a link; private use; schedule-driven, capped per day."
max_items = 0
gate6 = false
terms_ok = true

[sources.bls]
enabled = true
kind = "macro"
url = "https://www.bls.gov/schedule/news_release/bls.ics"
paths = []
min_spacing_s = 604800.0
idle_spacing_s = 604800.0
allowed_hosts = ["www.bls.gov"]
terms_note = "Public schedule; weekly. Path UNVERIFIED until build step 2."
max_items = 0
gate6 = false
terms_ok = true

[sources.bls_data]
enabled = true
